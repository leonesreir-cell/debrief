:root{
  --bg:#122036; --panel:#1A2C47; --panel-2:#21385B; --line:#2F4A73;
  --ink:#E8EEF6; --ink-2:#B3C1D4; --muted:#8799B2;
  --accent:#DB4E97; --accent-press:#C23F84; --data:#5B93DE;
  --ok:#2FAE78; --warn:#D9932A; --bad:#E5544F;
  --font:'B612',system-ui,-apple-system,sans-serif;
  --mono:'B612',system-ui,sans-serif; /* figures */
  --digits:'B612 Mono',ui-monospace,Menlo,monospace; /* score keys only */
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;line-height:1.5}
body.noscroll{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
p{margin:0 0 .75rem}
main{max-width:560px;margin:0 auto;padding:calc(var(--sat) + 16px) 20px calc(var(--sab) + 104px)}
h1{font-size:1.75rem;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.125rem;line-height:1.3;margin:0 0 .75rem;font-weight:700}
h3.mini{font-size:.9375rem;font-weight:700;margin:1.25rem 0 .5rem;color:var(--ink)}
.sub{color:var(--ink-2);margin:.35rem 0 0;font-size:.9375rem}
.muted{color:var(--muted)}
.small{font-size:.8125rem}
.mono{font-family:var(--mono)}
.center{text-align:center}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.vhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:4px 0 24px}
.icon-btn{background:none;border:0;padding:10px;margin:-8px -10px 0 0;border-radius:12px;color:var(--ink-2);flex:none}
.icon-btn svg{width:24px;height:24px;display:block}

.block{background:var(--panel);border-radius:16px;padding:16px;margin:0 0 16px}
.block>h2:first-child{margin-top:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font-weight:700;text-decoration:none;font-size:.9375rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:active{background:var(--accent-press)}
.btn.wide{width:100%}
.btn.big{min-height:56px;font-size:1.0625rem}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.small{min-height:38px;padding:0 12px;font-size:.8125rem;border-radius:10px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:rgba(18,32,54,.96);border-top:1px solid var(--line);padding:6px 8px calc(var(--sab) + 6px);z-index:10;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tabs button{flex:1;max-width:180px;background:none;border:0;color:var(--muted);padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.75rem}
.tabs svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] svg{color:var(--accent)}

/* Phase band: the 25/25/50 rule made visible */
.band{display:flex;gap:3px;height:12px}
.band .seg{position:relative;min-width:0;background:var(--panel-2);border-radius:3px;overflow:hidden}
.band .seg.on{background:#28466F;box-shadow:inset 0 0 0 1px var(--data)}
.band .seg i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--data);border-radius:0 3px 3px 0;transition:width .9s linear}
.band-labels{display:flex;gap:3px;margin-top:7px;font-size:.75rem;line-height:1.3;color:var(--muted)}
.band-labels span{min-width:0}
.band-labels span.on{color:var(--ink)}
.band-labels em{display:block;font-style:normal;font-size:.6875rem;color:var(--muted)}
.method{margin:28px 0 8px}
.method p{font-size:.875rem;color:var(--ink-2);margin-top:12px}

/* Goals */
.goal-list{margin:0;padding-left:1.4rem}
.goal-list li{margin:.25rem 0}
.goal{padding:14px 0;border-bottom:1px solid var(--line)}
.goal:first-child{padding-top:2px}
.goal:last-child{border-bottom:0;padding-bottom:2px}
.goal p{margin:0 0 10px;font-weight:700}
.goal input{margin-bottom:10px}
.seg3{display:flex;gap:6px}
.seg3 button{flex:1;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);display:flex;align-items:center;justify-content:center;gap:6px;font-size:.875rem;padding:0 6px}
.seg3 button[aria-pressed="true"]{background:#2A4A76;border-color:var(--data);font-weight:700}
.seg3 button[aria-pressed="true"][data-v="hit"]{border-color:var(--ok);background:rgba(47,174,120,.16)}
.seg3 button[aria-pressed="true"][data-v="partial"]{border-color:var(--warn);background:rgba(217,147,42,.16)}
.seg3 button[aria-pressed="true"][data-v="miss"]{border-color:var(--bad);background:rgba(229,84,79,.16)}
.st{width:16px;height:16px;flex:none}
.st.hit{color:var(--ok)} .st.partial{color:var(--warn)} .st.miss{color:var(--bad)}
.tally{font-family:var(--mono);font-size:.9375rem;margin:4px 0 0;min-height:1.5em}

/* Scores */
.score-row{padding:12px 0;border-bottom:1px solid var(--line)}
.score-row:first-child{padding-top:0}
.score-row:last-child{border-bottom:0;padding-bottom:0}
.score-name{font-weight:700;margin-bottom:8px}
.scale{display:flex;gap:6px}
.scale button{flex:1;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);font-family:var(--digits);font-size:1.0625rem}
.scale button[aria-pressed="true"]{background:var(--data);border-color:var(--data);color:#0D1A2C;font-weight:700}
.scale-ends{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);margin-top:4px}

/* Fields */
.field{display:block;margin:0 0 16px}
.field>span{display:block;font-size:.875rem;color:var(--ink-2);margin-bottom:6px}
input[type=text],input[type=search],input:not([type]),textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:1rem;line-height:1.45;-webkit-appearance:none;appearance:none}
input:focus,textarea:focus{border-color:var(--data);outline:none}
textarea{min-height:128px;resize:vertical;display:block}
::placeholder{color:var(--muted);opacity:1}

.hint{font-size:.875rem;color:var(--ink-2);border-left:2px solid var(--accent);padding:2px 0 2px 12px;margin:16px 0 0}
.warn-note{font-size:.875rem;border:1px solid var(--warn);border-radius:12px;padding:12px 14px;margin:0 0 16px}

/* Error types */
.types{display:grid;gap:8px}
.type{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel-2);border-radius:12px;padding:12px 14px}
.type b{display:block;font-size:1rem}
.type small{display:block;color:var(--ink-2);font-size:.8125rem;margin-top:3px;line-height:1.4}
.type small.ex{color:var(--muted);font-style:italic}
.type[aria-pressed="true"]{border-color:var(--data);box-shadow:inset 0 0 0 1px var(--data);background:#22406A}
.type.none{padding:12px 14px}

/* Lessons */
.lesson .field:last-of-type{margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 12px;font-size:.8125rem;color:var(--ink-2);text-align:left}
.recur{font-size:.875rem;border:1px solid var(--warn);border-radius:12px;padding:12px 14px;margin:0 0 12px}
.recur b{display:block;margin-bottom:4px}
.recur .btn{margin-top:8px;padding-left:0}

/* Flow */
.flow{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column}
.flow[hidden]{display:none}
.flow-head{padding:calc(var(--sat) + 10px) 20px 14px;max-width:560px;width:100%;margin:0 auto}
.flow-top{display:flex;justify-content:space-between;align-items:center;margin:0 -8px 14px}
.flow-top .count{font-size:.8125rem;color:var(--ink-2)}
.flow-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;border-top:1px solid var(--line)}
.flow-inner{max-width:560px;margin:0 auto;padding:20px 20px 32px}
.flow-foot-wrap{border-top:1px solid var(--line);background:var(--bg)}
.flow-foot{display:flex;gap:10px;max-width:560px;margin:0 auto;padding:10px 20px calc(var(--sab) + 10px)}
.flow-foot .btn{flex:1}
.flow-foot .btn.back{flex:0 0 auto}
.step-title{font-size:1.5rem;line-height:1.2;margin:0 0 6px}
.step-q{color:var(--ink-2);margin:0 0 18px}
.timer-line{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:.8125rem;color:var(--ink-2);min-height:38px}
.timer-line .t{font-family:var(--mono);color:var(--ink)}
.done-mark{font-size:2.5rem;line-height:1}

/* Summary */
.sum{margin:0}
.sum dt{font-size:.8125rem;color:var(--muted);margin-top:12px}
.sum dt:first-child{margin-top:0}
.sum dd{margin:2px 0 0}
.sum ol{margin:2px 0 0;padding-left:1.3rem}
.sum li{margin:2px 0}
.sum .gl li{display:flex;align-items:flex-start;gap:8px;list-style:none;margin-left:-1.3rem}
.sum .gl .st{margin-top:4px}
.sum .lsn+.lsn{margin-top:8px}

/* Log */
.trend{padding:12px 0;border-bottom:1px solid var(--line)}
.trend:last-child{border-bottom:0;padding-bottom:0}
.trend:first-of-type{padding-top:0}
.trend-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.trend-top b{font-size:.9375rem}
.trend-top .v{font-family:var(--mono);font-size:.8125rem;color:var(--ink-2)}
.trend svg{display:block;width:100%;height:48px;margin-top:6px;touch-action:pan-y}
.trend .cap{font-size:.75rem;color:var(--muted);min-height:1.2em;font-family:var(--mono)}
.list-h{margin:24px 0 12px}
.entry{display:block;width:100%;text-align:left;background:var(--panel);border:0;border-radius:16px;padding:14px 16px;margin:0 0 10px}
.entry-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.entry .d{font-weight:700}
.entry .sc{font-size:.8125rem;color:var(--ink-2);margin:4px 0 0}
.entry .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.entry .lsn{margin:10px 0 0;font-size:.875rem}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.8125rem;color:var(--ink-2)}
.pill .st{width:14px;height:14px}

/* Week */
.weeknav{display:flex;justify-content:space-between;margin:-8px 0 16px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stats>div{background:var(--panel-2);border-radius:12px;padding:12px}
.stats .big{display:block;font-size:1.75rem;line-height:1.1;font-weight:700}
.stats .lbl{display:block;font-size:.8125rem;color:var(--ink-2);margin-top:4px}
.bar-row{display:grid;grid-template-columns:7rem 1fr 2.75rem;align-items:center;gap:10px;padding:5px 0;font-size:.875rem}
.bar-row .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:10px;background:var(--panel-2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--data);border-radius:0 4px 4px 0}
.bar-row .v{font-family:var(--mono);text-align:right;font-size:.8125rem}
.wl{list-style:none;margin:0;padding:0}
.wl li{padding:12px 0;border-bottom:1px solid var(--line)}
.wl li:first-child{padding-top:0}
.wl li:last-child{border-bottom:0;padding-bottom:0}
.wl .dt{display:block;font-size:.75rem;color:var(--muted);font-family:var(--mono)}
.wl .act{display:block;font-size:.875rem;color:var(--ink-2)}
.flag{display:inline-block;margin-top:6px;font-size:.8125rem;border:1px solid var(--warn);border-radius:999px;padding:2px 10px}

/* Sheets and dialogs */
.backdrop{position:fixed;inset:0;background:rgba(5,10,20,.62);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.backdrop.top{z-index:35;align-items:center;padding:20px}
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:20px 20px 0 0;padding:20px 20px calc(var(--sab) + 24px)}
.dialog{background:var(--panel);width:100%;max-width:400px;border-radius:18px;padding:20px}
.dialog p{color:var(--ink-2)}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
.sheet section{padding:16px 0;border-top:1px solid var(--line)}
.sheet section:first-of-type{border-top:0;padding-top:4px}
.theme-row{display:flex;gap:8px;margin-top:8px}
.theme-row input{flex:1}
.toggle{display:flex;align-items:center;gap:12px;font-size:.9375rem}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
details summary{font-weight:700;cursor:pointer;padding:4px 0;list-style-position:outside}
details[open] summary{margin-bottom:8px}
details p,details li{font-size:.875rem;color:var(--ink-2)}
details ol{padding-left:1.2rem;margin:0}
textarea.dump{min-height:160px;font-family:var(--mono);font-size:.75rem}

.note{background:var(--panel);border-radius:14px;padding:14px 16px;margin:0 0 16px;font-size:.875rem;color:var(--ink-2)}
.note .row{margin-top:10px}
.note .row .btn{flex:0 0 auto}
.note b{color:var(--ink)}
.streak{margin:20px 0 0;color:var(--ink-2);font-size:.875rem}
.streak .mono{color:var(--ink);font-weight:700}

#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 88px);transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.875rem;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main id="main" aria-live="polite"></main>

<nav class="tabs" id="tabs" aria-label="Hovedmeny">
  <button data-tab="tonight"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10z"/></svg>I kveld</button>
  <button data-tab="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18l5-6 4 3 7-9"/></svg>Logg</button>
  <button data-tab="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4" stroke-linecap="round"/></svg>Uke</button>
</nav>

<section id="flow" class="flow" hidden aria-label="Kveldsdebrief"></section>
<div id="sheet-root"></div>
<div id="dialog-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
(function(){
'use strict';

/* ---------- constants ---------- */
const KEY='debrief.v1';
const DAYS=['søndag','mandag','tirsdag','onsdag','torsdag','fredag','lørdag'];
const MONTHS=['januar','februar','mars','april','mai','juni','juli','august','september','oktober','november','desember'];
const MON_SHORT=['jan.','feb.','mars','apr.','mai','juni','juli','aug.','sep.','okt.','nov.','des.'];
const PHASES=[{name:'Hva skjedde',share:.25},{name:'Hvorfor',share:.25},{name:'Neste gang',share:.5}];
const STEPS=[
  {id:'score',phase:0},{id:'goals',phase:0},{id:'facts',phase:0},
  {id:'good',phase:1},{id:'deviation',phase:1},
  {id:'lessons',phase:2},{id:'tomorrow',phase:2},{id:'summary',phase:2}
];
const ERR={
  input:{label:'Input-feil',desc:'Du oppfattet situasjonen feil, og derfor ble både beslutningen og gjennomføringen feil.',ex:'«Trodde jeg hadde tre timer, glemte avtalen kl. 18»',fix:'bedre planlegging og tidsanslag'},
  decision:{label:'Beslutningsfeil',desc:'Du forsto situasjonen riktig, men tok feil valg.',ex:'«Visste jeg burde lese, valgte YouTube»',fix:'bestem på forhånd: «hvis X, så gjør jeg Y»'},
  execution:{label:'Utførelsesfeil',desc:'Du oppfattet situasjonen og valgte riktig, men gjennomføringen ble ikke som tenkt.',ex:'«Satte meg ned for å lese, men mobilen lå på pulten»',fix:'endre omgivelsene eller teknikken'}
};
const STATUS={hit:'Nådd',partial:'Delvis',miss:'Ikke'};
const ST_ICON={
  hit:'<svg class="st hit" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  partial:'<svg class="st partial" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/></svg>',
  miss:'<svg class="st miss" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
};
const ICON={
  sliders:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
const dec=(n,d=1)=>n.toFixed(d).replace('.',',');
const pad=n=>String(n).padStart(2,'0');
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return iso(d);}
function fmtLong(s){const d=parse(s);return cap(DAYS[d.getDay()])+' '+d.getDate()+'. '+MONTHS[d.getMonth()];}
function fmtShort(s){const d=parse(s);return cap(DAYS[d.getDay()].slice(0,3))+' '+d.getDate()+'. '+MON_SHORT[d.getMonth()];}
function debriefDate(){const d=new Date();if(d.getHours()<4)d.setDate(d.getDate()-1);return iso(d);} // after midnight still counts as the evening before
function weekMonday(s){const d=parse(s);const k=d.getDay()||7;d.setDate(d.getDate()-k+1);return iso(d);}
function isoWeek(s){const d=parse(s);const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const k=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-k);const y=t.getUTCFullYear();const w=Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7);return {y,w,key:y+'-W'+pad(w)};}
function rangeText(a,b){const A=parse(a),B=parse(b);return A.getMonth()===B.getMonth()?`${A.getDate()}.–${B.getDate()}. ${MONTHS[B.getMonth()]}`:`${A.getDate()}. ${MON_SHORT[A.getMonth()]} – ${B.getDate()}. ${MON_SHORT[B.getMonth()]}`;}
function mmss(ms){const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+pad(s%60);}
function trunc(s,n){s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s;}
function setPath(o,p,v){const k=p.split('.');let x=o;for(let i=0;i<k.length-1;i++)x=x[k[i]];x[k[k.length-1]]=v;}
function getPath(o,p){return p.split('.').reduce((x,k)=>x==null?x:x[k],o);}

/* ---------- storage ---------- */
function fresh(){return {v:1,
  themes:[{id:'energi',name:'Energi'},{id:'motivasjon',name:'Motivasjon'},{id:'fokus',name:'Fokus'},{id:'fremgang',name:'Fremgang'}],
  settings:{timerMin:10,showFacts:true,hideInstall:false},
  entries:{},weeks:{},draft:null,lastBackup:null,created:new Date().toISOString()};}
function normalize(o){
  const f=fresh(); o=(o&&typeof o==='object')?o:{};
  return {v:1,
    themes:Array.isArray(o.themes)&&o.themes.length?o.themes.filter(t=>t&&t.id&&typeof t.name==='string'):f.themes,
    settings:Object.assign({},f.settings,o.settings||{}),
    entries:(o.entries&&typeof o.entries==='object')?o.entries:{},
    weeks:(o.weeks&&typeof o.weeks==='object')?o.weeks:{},
    draft:o.draft||null,lastBackup:o.lastBackup||null,created:o.created||f.created};
}
let storageOK=true;
function load(){try{const raw=localStorage.getItem(KEY);return raw?normalize(JSON.parse(raw)):fresh();}catch(e){storageOK=false;return fresh();}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));storageOK=true;}catch(e){storageOK=false;}}
let saveTimer=null;
function saveSoon(){clearTimeout(saveTimer);saveTimer=setTimeout(save,350);}
let db=load();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});}catch(e){}

/* ---------- domain ---------- */
function steps(){return STEPS.filter(s=>s.id!=='facts'||db.settings.showFacts);}
function prevEntryDate(date){return Object.keys(db.entries).filter(d=>d<date).sort().pop()||null;}
function goalsFor(date){const p=prevEntryDate(date);if(!p)return null;return {from:p,goals:(db.entries[p].tomorrow||[]).filter(t=>t&&t.trim())};}
function newData(date){
  const src=goalsFor(date);
  return {date,scores:{},goals:src?src.goals.map(t=>({text:t,status:null})):[],goalsFrom:src?src.from:null,
    facts:{screen:'',sleep:'',training:''},good:'',deviation:'',errType:null,
    lessons:[{id:null,text:'',action:''}],tomorrow:['','',''],savedAt:null};
}
function prepData(d){
  d.scores=d.scores||{}; d.goals=d.goals||[]; d.facts=Object.assign({screen:'',sleep:'',training:''},d.facts||{});
  d.lessons=(d.lessons&&d.lessons.length)?d.lessons:[{id:null,text:'',action:''}];
  d.tomorrow=(d.tomorrow||[]).slice(0,3); while(d.tomorrow.length<3)d.tomorrow.push('');
  d.good=d.good||''; d.deviation=d.deviation||''; return d;
}
function cleanData(src){
  const c=clone(src);
  c.goals=(c.goals||[]).filter(g=>g.text&&g.text.trim()).map(g=>({text:g.text.trim(),status:g.status||null,manual:!!g.manual}));
  c.lessons=(c.lessons||[]).filter(l=>(l.text||'').trim()||(l.action||'').trim()).map(l=>({id:l.id||null,text:(l.text||'').trim(),action:(l.action||'').trim()}));
  c.tomorrow=(c.tomorrow||[]).map(t=>(t||'').trim()).filter(Boolean);
  c.good=(c.good||'').trim(); c.deviation=(c.deviation||'').trim();
  c.facts={screen:(c.facts&&c.facts.screen||'').trim(),sleep:(c.facts&&c.facts.sleep||'').trim(),training:(c.facts&&c.facts.training||'').trim()};
  return c;
}
function tally(goals){
  const g=(goals||[]).filter(x=>x.text&&x.text.trim()); const n=g.length; if(!n)return null;
  const hit=g.filter(x=>x.status==='hit').length, part=g.filter(x=>x.status==='partial').length, rated=g.filter(x=>x.status).length;
  return {n,hit,part,rated,rate:(hit+part*.5)/n};
}
function tallyText(goals){const t=tally(goals);if(!t)return '';let s=`${t.hit} av ${t.n} nådd`;if(t.part)s+=`, ${t.part} delvis`;return s;}
function lessonRegistry(excludeDate){
  const map={};
  Object.keys(db.entries).sort().forEach(date=>{
    if(date===excludeDate)return;
    (db.entries[date].lessons||[]).forEach(l=>{
      if(!l.id)return;
      const r=map[l.id]||(map[l.id]={id:l.id,text:l.text,dates:[],actions:[]});
      if(l.text)r.text=l.text; r.dates.push(date); if(l.action)r.actions.push({date,action:l.action});
    });
  });
  return map;
}
function recentLessons(reg){return Object.values(reg).sort((a,b)=>a.dates[a.dates.length-1]<b.dates[b.dates.length-1]?1:-1);}
function streak(){let d=debriefDate();if(!db.entries[d])d=addDays(d,-1);let n=0;while(db.entries[d]){n++;d=addDays(d,-1);}return n;}
const isStandalone=()=>window.navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);

/* ---------- shared bits ---------- */
function vhead(title,sub){return `<div class="vhead"><div><h1>${title}</h1>${sub?`<p class="sub">${sub}</p>`:''}</div><button class="icon-btn" data-act="settings" aria-label="Innstillinger">${ICON.sliders}</button></div>`;}
function bandHTML(active){
  return `<div class="band" aria-hidden="true">${PHASES.map((p,i)=>`<div class="seg${i===active?' on':''}" style="flex:${p.share*4}"><i data-fill="${i}"></i></div>`).join('')}</div>
  <div class="band-labels">${PHASES.map((p,i)=>`<span class="${i===active?'on':''}" style="flex:${p.share*4}">${p.name}<em>${Math.round(p.share*100)} %</em></span>`).join('')}</div>`;
}
function statusPill(s){return s?`${ST_ICON[s]}${STATUS[s]}`:'<span class="muted">Ikke vurdert</span>';}
function summaryHTML(e){
  const rows=[];
  const sc=db.themes.filter(t=>e.scores&&e.scores[t.id]).map(t=>`${esc(t.name)} <b class="mono">${e.scores[t.id]}</b>`);
  if(sc.length)rows.push(['Score',sc.join(', ')]);
  if(e.goals&&e.goals.length)rows.push(['Dagens mål',`<ol class="gl">${e.goals.map(g=>`<li>${g.status?ST_ICON[g.status]:'<span class="st"></span>'}<span>${esc(g.text)} <span class="muted small">${g.status?STATUS[g.status].toLowerCase():'ikke vurdert'}</span></span></li>`).join('')}</ol><span class="mono small">${tallyText(e.goals)}</span>`]);
  const f=e.facts||{}; const fx=[];
  if(f.screen)fx.push(`skjermtid ${esc(f.screen)} t`); if(f.sleep)fx.push(`søvn ${esc(f.sleep)} t`); if(f.training)fx.push(`trening: ${esc(f.training)}`);
  if(fx.length)rows.push(['Fakta',cap(fx.join(', '))]);
  if(e.good)rows.push(['Gikk bra',esc(e.good)]);
  if(e.errType==='none')rows.push(['Avvik','Ingen stort avvik']);
  else if(e.deviation||e.errType)rows.push(['Avvik',(ERR[e.errType]?`<b>${ERR[e.errType].label}.</b> `:'')+esc(e.deviation)]);
  const ls=(e.lessons||[]).filter(l=>l.text||l.action);
  if(ls.length)rows.push([ls.length>1?'Lærdommer':'Lærdom',ls.map(l=>`<div class="lsn">${esc(l.text)}${l.action?`<br><span class="muted">Tiltak: ${esc(l.action)}</span>`:''}</div>`).join('')]);
  const tm=(e.tomorrow||[]).filter(t=>t&&t.trim());
  if(tm.length)rows.push(['Mål for neste dag',`<ol>${tm.map(t=>`<li>${esc(t)}</li>`).join('')}</ol>`]);
  if(!rows.length)return '<p class="muted">Ingenting fylt inn.</p>';
  return `<dl class="sum">${rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
}
function banners(){
  let h='';
  const today=debriefDate();
  if(!storageOK)h+=`<div class="note"><b>Appen får ikke lagret.</b> Åpne den fra Hjem-skjermen eller i Safari uten privat surfing.</div>`;
  if(db.draft&&db.draft.date!==today&&!db.draft.editing)h+=`<div class="note"><b>Du har en uferdig debrief fra ${fmtShort(db.draft.date).toLowerCase()}.</b><div class="row"><button class="btn small" data-act="resumeOld">Fortsett den</button><button class="btn small ghost" data-act="discardOld">Forkast</button></div></div>`;
  if(!isStandalone()&&!db.settings.hideInstall)h+=`<div class="note"><b>Legg appen på Hjem-skjermen.</b> Trykk på Del i Safari og velg «Legg til på Hjem-skjerm». Da åpnes den i fullskjerm og virker uten nett.<div class="row"><button class="btn small ghost" data-act="dismissInstall">Skjul</button></div></div>`;
  const n=Object.keys(db.entries).length;
  const last=db.lastBackup?new Date(db.lastBackup).getTime():0;
  if(n>=5&&Date.now()-last>21*864e5)h+=`<div class="note"><b>Ta en sikkerhetskopi.</b> Alt ligger bare på denne telefonen. Sletter du appen, forsvinner det.<div class="row"><button class="btn small" data-act="export">Lagre sikkerhetskopi</button></div></div>`;
  return h;
}

/* ---------- views ---------- */
let view='tonight', weekRef=null, sparkData={}, curWeekKey=null;

function renderTonight(){
  const date=debriefDate(), entry=db.entries[date];
  const draft=(db.draft&&db.draft.date===date&&!db.draft.editing)?db.draft:null;
  let h=vhead(fmtLong(date),entry?'Kveldens debrief er gjort.':`Kveldsdebrief, ca. ${db.settings.timerMin} minutter`);
  h+=banners();
  if(!entry){
    const src=goalsFor(date);
    h+=`<section class="block"><h2>Målene for i dag</h2>`;
    if(src&&src.goals.length){
      h+=`<ol class="goal-list">${src.goals.map(g=>`<li>${esc(g)}</li>`).join('')}</ol>`;
      if(src.from!==addDays(date,-1))h+=`<p class="sub">Satt ${fmtShort(src.from).toLowerCase()}.</p>`;
    }else if(Object.keys(db.entries).length){
      h+=`<p class="muted">Du satte ingen mål sist. I kveld setter du nye på slutten.</p>`;
    }else{
      h+=`<p class="muted">Ingen mål ennå. Du setter dem på slutten av den første debriefen, og neste kveld måler du deg mot dem.</p>`;
    }
    h+=`</section>`;
    h+=`<button class="btn primary wide big" data-act="start">${draft?'Fortsett debriefen':'Start debrief'}</button>`;
    if(draft)h+=`<p class="sub center">Du er på steg ${Math.min(draft.step,steps().length-1)+1} av ${steps().length}.</p>`;
    h+=`<div class="method">${bandHTML(-1)}<p>Halve tida går til neste gang. Det gir lite rom for å kverne på det som gikk dårlig, og mye rom for å bestemme hva du gjør annerledes.</p></div>`;
  }else{
    const tm=(entry.tomorrow||[]);
    h+=`<section class="block"><h2>Målene for i morgen</h2>${tm.length?`<ol class="goal-list">${tm.map(t=>`<li>${esc(t)}</li>`).join('')}</ol>`:'<p class="muted">Du satte ingen mål for i morgen.</p>'}</section>`;
    h+=`<section class="block"><h2>Kvelden i kortversjon</h2>${summaryHTML(entry)}</section>`;
    h+=`<button class="btn wide" data-act="edit" data-date="${date}">Endre debriefen</button>`;
  }
  if(parse(date).getDay()===0)h+=`<div class="note" style="margin-top:16px"><b>Det er søndag.</b> Ta ukesgjennomgangen: les gjennom ukas lærdommer og se hva som går igjen. Sett av 20–30 minutter.<div class="row"><button class="btn small" data-act="goWeek">Åpne ukesgjennomgangen</button></div></div>`;
  const s=streak();
  if(s>=2)h+=`<p class="streak"><span class="mono">${s}</span> kvelder på rad.</p>`;
  return h;
}

function renderLog(){
  const dates=Object.keys(db.entries).sort().reverse();
  let h=vhead('Logg',dates.length?`${dates.length} ${dates.length===1?'kveld':'kvelder'} logget`:'');
  if(!dates.length)return h+`<div class="block"><p>Ingen kvelder ennå. Når du har tatt den første debriefen, dukker den opp her.</p><button class="btn primary" data-act="start">Start debrief</button></div>`;
  // trends, last 30 days
  const end=debriefDate(), N=30, start=addDays(end,-(N-1));
  const days=[...Array(N)].map((_,i)=>addDays(start,i));
  sparkData={};
  const rows=[];
  db.themes.forEach(t=>{
    const pts=[];days.forEach((d,i)=>{const e=db.entries[d];if(e&&e.scores&&e.scores[t.id])pts.push({i,date:d,v:e.scores[t.id]});});
    const wk=pts.filter(p=>p.i>=N-7); const avg=wk.length?wk.reduce((a,p)=>a+p.v,0)/wk.length:null;
    sparkData[t.id]={pts,min:1,max:5,fmt:v=>`${v} av 5`};
    rows.push({id:t.id,name:t.name,right:avg==null?'':`snitt 7 dager: ${dec(avg)}`,n:pts.length});
  });
  {
    const pts=[];days.forEach((d,i)=>{const e=db.entries[d];const t=e&&tally(e.goals);if(t&&t.rated)pts.push({i,date:d,v:t.rate});});
    const wk=pts.filter(p=>p.i>=N-7); const avg=wk.length?wk.reduce((a,p)=>a+p.v,0)/wk.length:null;
    sparkData.__goals={pts,min:0,max:1,fmt:v=>`${Math.round(v*100)} % av målene`};
    rows.push({id:'__goals',name:'Mål nådd',right:avg==null?'':`snitt 7 dager: ${Math.round(avg*100)} %`,n:pts.length});
  }
  h+=`<section class="block"><h2>Siste 30 dager</h2>${rows.map(r=>`<div class="trend"><div class="trend-top"><b>${esc(r.name)}</b><span class="v">${r.right}</span></div><svg data-series="${esc(r.id)}" role="img" aria-label="${esc(r.name)}, siste 30 dager"></svg><div class="cap">${r.n>=2?'Trykk på grafen for å se en dag.':'For lite data ennå.'}</div></div>`).join('')}</section>`;
  h+=`<h2 class="list-h">Alle kvelder</h2>`;
  h+=dates.map(d=>{
    const e=db.entries[d]; const t=tally(e.goals);
    const sc=db.themes.filter(x=>e.scores&&e.scores[x.id]).map(x=>`${esc(x.name)} ${e.scores[x.id]}`).join(', ');
    const pills=[];
    if(t)pills.push(`<span class="pill">Mål <span class="mono">${t.hit}/${t.n}</span>${t.part?` <span class="mono">+${t.part}</span> delvis`:''}</span>`);
    if(ERR[e.errType])pills.push(`<span class="pill">${ERR[e.errType].label}</span>`);
    const l=(e.lessons||[]).find(x=>x.text);
    return `<button class="entry" data-act="detail" data-date="${d}"><div class="entry-top"><span class="d">${fmtShort(d)}</span></div>${sc?`<p class="sc">${sc}</p>`:''}${pills.length?`<div class="meta">${pills.join('')}</div>`:''}${l?`<p class="lsn">${esc(trunc(l.text,90))}</p>`:''}</button>`;
  }).join('');
  return h;
}

function drawSparks(){
  $$('svg[data-series]').forEach(svg=>{
    const s=sparkData[svg.dataset.series]; if(!s)return;
    const W=Math.max(120,Math.round(svg.getBoundingClientRect().width)||300),H=48,px=6,py=7,N=30;
    svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
    const X=i=>px+(W-2*px)*i/(N-1), Y=v=>H-py-(H-2*py)*(v-s.min)/(s.max-s.min);
    let g=`<line x1="${px}" x2="${W-px}" y1="${Y(s.min)}" y2="${Y(s.min)}" stroke="#2F4A73" stroke-width="1"/>`;
    g+=`<line x1="${px}" x2="${W-px}" y1="${Y(s.max)}" y2="${Y(s.max)}" stroke="#2F4A73" stroke-width="1" stroke-dasharray="2 4"/>`;
    let d='',prev=null;
    s.pts.forEach(p=>{d+=`${(prev&&p.i-prev.i<=3)?'L':'M'}${X(p.i).toFixed(1)} ${Y(p.v).toFixed(1)}`;prev=p;});
    if(d)g+=`<path d="${d}" fill="none" stroke="#5B93DE" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.pts.forEach((p,k)=>{const a=s.pts[k-1],b=s.pts[k+1];if((!a||p.i-a.i>3)&&(!b||b.i-p.i>3)&&k!==s.pts.length-1)g+=`<circle cx="${X(p.i)}" cy="${Y(p.v)}" r="4" fill="#5B93DE"/>`;});
    const last=s.pts[s.pts.length-1];
    if(last)g+=`<circle cx="${X(last.i)}" cy="${Y(last.v)}" r="4" fill="#5B93DE" stroke="#1A2C47" stroke-width="2"/>`;
    g+=`<g class="hv" style="display:none"><line y1="2" y2="${H-2}" stroke="#B3C1D4" stroke-width="1"/><circle r="4.5" fill="#E8EEF6" stroke="#1A2C47" stroke-width="2"/></g>`;
    svg.innerHTML=g;
    if(!s.pts.length)return;
    const capEl=svg.parentElement.querySelector('.cap'), hv=svg.querySelector('.hv'), ln=hv.querySelector('line'), ci=hv.querySelector('circle');
    const pick=ev=>{
      const r=svg.getBoundingClientRect(); const x=(ev.clientX-r.left)*(W/r.width);
      let best=s.pts[0],bd=1e9; s.pts.forEach(p=>{const dd=Math.abs(X(p.i)-x);if(dd<bd){bd=dd;best=p;}});
      hv.style.display=''; ln.setAttribute('x1',X(best.i)); ln.setAttribute('x2',X(best.i)); ci.setAttribute('cx',X(best.i)); ci.setAttribute('cy',Y(best.v));
      capEl.textContent=`${fmtShort(best.date)}: ${s.fmt(best.v)}`;
    };
    svg.addEventListener('pointerdown',pick); svg.addEventListener('pointermove',pick);
  });
}

function curMonday(){return weekRef||weekMonday(debriefDate());}
function renderWeek(){
  const mon=curMonday(), sun=addDays(mon,6), wk=isoWeek(mon); curWeekKey=wk.key;
  const days=[...Array(7)].map((_,i)=>addDays(mon,i));
  const es=days.filter(d=>db.entries[d]).map(d=>Object.assign({date:d},db.entries[d]));
  const isCurrent=mon===weekMonday(debriefDate());
  let h=vhead('Søndagsgjennomgang',`Uke ${wk.w}, ${rangeText(mon,sun)}`);
  h+=`<div class="weeknav"><button class="btn small" data-act="wprev">‹ Forrige uke</button><button class="btn small" data-act="wnext" ${isCurrent?'disabled':''}>Neste uke ›</button></div>`;
  if(!es.length){
    h+=`<div class="block"><p>Ingen kvelder logget denne uka.</p>${isCurrent?'<button class="btn primary" data-act="start">Start kveldens debrief</button>':''}</div>`;
  }else{
    let gn=0,gs=0; es.forEach(e=>{const t=tally(e.goals);if(t){gn+=t.n;gs+=t.hit+t.part*.5;}});
    h+=`<section class="block"><h2>Uka i tall</h2><div class="stats">
      <div><span class="big mono">${es.length}</span><span class="lbl">av 7 kvelder logget</span></div>
      <div><span class="big mono">${gn?Math.round(gs/gn*100)+' %':'–'}</span><span class="lbl">av målene nådd${gn?', delvis teller halvt':''}</span></div></div>`;
    h+=`<h3 class="mini">Snitt per tema</h3>`;
    db.themes.forEach(t=>{const v=es.map(e=>e.scores&&e.scores[t.id]).filter(Boolean);const a=v.length?v.reduce((x,y)=>x+y,0)/v.length:null;
      h+=`<div class="bar-row"><span class="n">${esc(t.name)}</span><div class="bar">${a?`<i style="width:${a/5*100}%"></i>`:''}</div><span class="v">${a?dec(a):'–'}</span></div>`;});
    const cnt={input:0,decision:0,execution:0}; es.forEach(e=>{if(cnt[e.errType]!=null)cnt[e.errType]++;});
    const mx=Math.max(1,...Object.values(cnt));
    h+=`<h3 class="mini">Feiltyper</h3>`;
    Object.keys(cnt).forEach(k=>{h+=`<div class="bar-row"><span class="n">${ERR[k].label}</span><div class="bar">${cnt[k]?`<i style="width:${cnt[k]/mx*100}%"></i>`:''}</div><span class="v">${cnt[k]}</span></div>`;});
    const top=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
    if(cnt[top]>=2)h+=`<p class="hint">Flest ${ERR[top].label.toLowerCase()}er denne uka. Typisk tiltak: ${ERR[top].fix}.</p>`;
    h+=`</section>`;
    const reg=lessonRegistry(null); const items=[];
    es.forEach(e=>(e.lessons||[]).forEach(l=>{if(l.text||l.action)items.push({date:e.date,l,n:l.id&&reg[l.id]?reg[l.id].dates.length:1});}));
    h+=`<section class="block"><h2>Ukas lærdommer</h2>${items.length?`<ul class="wl">${items.map(x=>`<li><span class="dt">${fmtShort(x.date)}</span>${esc(x.l.text)}${x.l.action?`<span class="act">Tiltak: ${esc(x.l.action)}</span>`:''}${x.n>=2?`<span class="flag">Har kommet ${x.n} ganger. Bytt tiltak.</span>`:''}</li>`).join('')}</ul>`:'<p class="muted">Ingen lærdommer skrevet denne uka.</p>'}
      ${items.some(x=>x.n>=2)?'<p class="hint">Når samme lærdom dukker opp igjen, virket ikke tiltaket. Bytt tiltak i stedet for å bare prøve hardere.</p>':''}</section>`;
  }
  const w=db.weeks[wk.key]||{};
  h+=`<section class="block"><h2>Gjennomgangen</h2><p class="sub" style="margin:0 0 16px">Sett av 20–30 minutter. En lengre gjennomgang gir mer når du gjør det alene.</p>
    <label class="field"><span>Hva er ukas viktigste lærdom?</span><textarea data-wbind="main">${esc(w.main)}</textarea></label>
    <label class="field"><span>Hvilke tiltak virket ikke, og hva bytter du til?</span><textarea data-wbind="swap">${esc(w.swap)}</textarea></label>
    <label class="field"><span>Hva er fokuset neste uke?</span><textarea data-wbind="focus">${esc(w.focus)}</textarea></label>
    <button class="btn primary wide" data-act="saveWeek">Lagre gjennomgangen</button>
    ${w.savedAt?`<p class="sub center">Sist lagret ${fmtShort(iso(new Date(w.savedAt))).toLowerCase()}.</p>`:''}</section>`;
  return h;
}

/* ---------- debrief flow ---------- */
let flow=null, tick=null;

async function openFlow(date){
  if(db.draft&&db.draft.date!==date&&!db.draft.editing){
    const ok=await confirmDialog(`Du har en uferdig debrief fra ${fmtShort(db.draft.date).toLowerCase()}. Vil du forkaste den?`,'Forkast den');
    if(!ok)return;
  }
  if(db.draft&&db.draft.date===date&&!(db.entries[date]&&!db.draft.editing))flow=db.draft;
  else if(db.entries[date])flow={date,data:clone(db.entries[date]),step:0,editing:true,timerStart:null};
  else flow={date,data:newData(date),step:0,editing:false,timerStart:null};
  prepData(flow.data);
  if(flow.step>=steps().length)flow.step=steps().length-1;
  db.draft=flow; save();
  closeSheet();
  $('#flow').hidden=false; document.body.classList.add('noscroll');
  renderFlow();
  clearInterval(tick); tick=setInterval(updateTimer,1000);
}
function closeFlow(){
  $('#flow').hidden=true; document.body.classList.remove('noscroll');
  clearInterval(tick); tick=null; flow=null; render();
}
function persist(){db.draft=flow;save();}
function persistSoon(){db.draft=flow;saveSoon();}

function renderFlow(){
  const S=steps(), s=S[flow.step];
  const last=s.id==='summary';
  $('#flow').innerHTML=`<div class="flow-head">
      <div class="flow-top"><button class="btn ghost small" data-act="close">${flow.editing?'Avbryt':'Lukk'}</button><span class="count">Steg ${flow.step+1} av ${S.length}</span><span class="count">${fmtShort(flow.date)}</span></div>
      ${bandHTML(s.phase)}
      <div class="timer-line"><span id="tmsg"></span><button class="btn small" id="tbtn" data-act="timer"></button></div>
    </div>
    <div class="flow-body" id="flowBody"><div class="flow-inner" id="flowInner">${stepHTML(s)}</div></div>
    <div class="flow-foot-wrap"><div class="flow-foot">
      ${flow.step>0?'<button class="btn back" data-act="back">Tilbake</button>':''}
      ${last?`<button class="btn primary" data-act="saveEntry">${flow.editing?'Lagre endringene':'Lagre debriefen'}</button>`:'<button class="btn primary" data-act="next">Neste</button>'}
    </div></div>`;
  lastTimerState=null; updateTimer();
}
function rerenderStep(){const b=$('#flowBody'),st=b.scrollTop;$('#flowInner').innerHTML=stepHTML(steps()[flow.step]);b.scrollTop=st;}

let lastTimerState=null;
function updateTimer(){
  if(!flow)return; const msg=$('#tmsg'),btn=$('#tbtn'); if(!msg)return;
  const fills=$$('#flow [data-fill]'); const total=db.settings.timerMin*60000;
  const sPhase=steps()[flow.step].phase;
  if(!flow.timerStart){
    fills.forEach(f=>f.style.width='0');
    if(lastTimerState!=='off'){msg.textContent='Fordel tida 25/25/50.';btn.textContent=`Start timer, ${db.settings.timerMin} min`;btn.className='btn small';lastTimerState='off';}
    return;
  }
  const el=Date.now()-flow.timerStart, f=Math.min(1,el/total);
  let acc=0,tPhase=PHASES.length-1;
  PHASES.forEach((p,i)=>{const w=Math.max(0,Math.min(1,(f-acc)/p.share));if(fills[i])fills[i].style.width=(w*100)+'%';if(tPhase===PHASES.length-1&&f<acc+p.share&&i<tPhase)tPhase=i;acc+=p.share;});
  if(f>=1){msg.textContent='Tida er ute. Fullfør i ditt eget tempo.';}
  else if(tPhase>sPhase){msg.textContent=`Tida for «${PHASES[sPhase].name}» er brukt. Gå videre når du kan.`;}
  else{const end=PHASES.slice(0,tPhase+1).reduce((a,p)=>a+p.share,0)*total;msg.innerHTML=`${PHASES[tPhase].name}: <span class="t">${mmss(end-el)}</span> igjen`;}
  if(lastTimerState!=='on'){btn.textContent='Stopp timer';btn.className='btn small ghost';lastTimerState='on';}
}

function stepHTML(s){
  const d=flow.data;
  switch(s.id){
  case 'score':
    return `<h2 class="step-title">Hurtigscore</h2><p class="step-q">Hvordan var dagen på hvert tema? 1 er svært lavt, 5 er svært bra.</p>
      <div class="block">${db.themes.map(t=>`<div class="score-row"><div class="score-name" id="lbl-${esc(t.id)}">${esc(t.name)}</div><div class="scale" role="group" aria-labelledby="lbl-${esc(t.id)}">${[1,2,3,4,5].map(n=>`<button aria-pressed="${d.scores[t.id]===n}" data-act="score" data-k="${esc(t.id)}" data-v="${n}">${n}</button>`).join('')}</div></div>`).join('')}</div>
      <p class="hint">Se på tallene som data, ikke som en dom over deg.</p>`;
  case 'goals':{
    const yest=addDays(flow.date,-1);
    let h=`<h2 class="step-title">Dagens mål</h2>`;
    if(d.goals.length){
      const fromTxt=d.goalsFrom?(d.goalsFrom===yest?'i går':fmtShort(d.goalsFrom).toLowerCase()):'';
      h+=`<p class="step-q">${fromTxt?`Målene du satte ${fromTxt}.`:'Dagens plan.'} Ble de nådd, delvis nådd eller ikke nådd?</p>`;
      h+=`<div class="block">${d.goals.map((g,i)=>`<div class="goal">${g.manual?`<input data-bind="goals.${i}.text" value="${esc(g.text)}" placeholder="Hva var planen?" aria-label="Mål ${i+1}">`:`<p>${esc(g.text)}</p>`}
        <div class="seg3" role="group" aria-label="Mål ${i+1}">${['hit','partial','miss'].map(v=>`<button data-act="gstat" data-i="${i}" data-v="${v}" aria-pressed="${g.status===v}">${ST_ICON[v]}${STATUS[v]}</button>`).join('')}</div></div>`).join('')}</div>
        <p class="tally" id="tally">${tallyText(d.goals)}</p>`;
    }else{
      h+=`<p class="step-q">${Object.keys(db.entries).filter(x=>x<flow.date).length?'Du satte ingen mål sist, så det er ingenting å måle mot i kveld.':'Første kveld, så du har ingen mål å måle deg mot ennå. Du setter dem på slutten, og i morgen måler du deg mot dem.'}</p>`;
    }
    h+=`<button class="btn small" data-act="addGoal">${d.goals.length?'Legg til et mål':'Skriv inn planen for i dag likevel'}</button>`;
    h+=`<p class="hint">Uten et mål å måle mot blir gjennomføring bare en følelse. Med mål blir det et tall, for eksempel «2 av 3 nådd».</p>`;
    return h;}
  case 'facts':
    return `<h2 class="step-title">Fakta fra dagen</h2><p class="step-q">Valgfritt. Tall slår hukommelse, så hent dem fra telefonen og klokka.</p>
      <label class="field"><span>Skjermtid i dag (timer)</span><input inputmode="decimal" data-bind="facts.screen" value="${esc(d.facts.screen)}" placeholder="f.eks. 3,5"></label>
      <label class="field"><span>Søvn i natt (timer)</span><input inputmode="decimal" data-bind="facts.sleep" value="${esc(d.facts.sleep)}" placeholder="f.eks. 7,5"></label>
      <label class="field"><span>Trening</span><input data-bind="facts.training" value="${esc(d.facts.training)}" placeholder="f.eks. intervaller 4 × 4 min"></label>
      <p class="hint">Skjermtid finner du i Innstillinger under Skjermtid. Søvn og trening ligger på klokka. Steget kan skrus av i innstillingene.</p>`;
  case 'good':
    return `<h2 class="step-title">Hva gikk bra?</h2><p class="step-q">Hva gikk bra i dag, og hva gjorde du som førte til det?</p>
      <textarea data-bind="good" aria-label="Hva gikk bra" placeholder="Fikk gjort intervalløkta fordi jeg la fram klærne kvelden før.">${esc(d.good)}</textarea>
      <p class="hint">Ta med suksessene. Soldater lærte mer når de også gikk gjennom det som gikk bra.</p>`;
  case 'deviation':
    return `<h2 class="step-title">Største avvik</h2><p class="step-q">Hvor ble forskjellen størst mellom plan og virkelighet? Hva skjedde konkret?</p>
      <textarea data-bind="deviation" aria-label="Største avvik" placeholder="Satte meg ned for å lese kl. 19, men mobilen lå på pulten og 40 minutter forsvant.">${esc(d.deviation)}</textarea>
      <h3 class="mini">Hvilken type feil var det?</h3>
      <div class="types" role="group" aria-label="Feiltype">${Object.keys(ERR).map(k=>`<button class="type" data-act="etype" data-v="${k}" aria-pressed="${d.errType===k}"><b>${ERR[k].label}</b><small>${ERR[k].desc}</small><small class="ex">${ERR[k].ex}</small></button>`).join('')}
        <button class="type none" data-act="etype" data-v="none" aria-pressed="${d.errType==='none'}"><b>Ingen stort avvik i dag</b></button></div>
      <p class="hint">Vær hard, men for å lære. Kritikken skal handle om hva du gjorde, ikke om hvem du er.</p>`;

        <label class="field"><span>Konkret tiltak</span><input data-bind="lessons.${i}.action" value="${esc(l.action)}" placeholder="Mobilen ligger i et annet rom når jeg leser."></label>`;
      if(!r&&recent.length)b+=`<div class="small muted">Samme lærdom som før? Trykk for å koble den, så teller appen hvor ofte den går igjen.</div><div class="chips">${recent.slice(0,6).map(x=>`<button class="chip" data-act="reuse" data-i="${i}" data-id="${esc(x.id)}">${esc(trunc(x.text,44))}</button>`).join('')}</div>`;
      if(i>0)b+=`<button class="btn small ghost danger" data-act="rmLesson" data-i="${i}" style="margin-top:8px;padding-left:0">Fjern lærdom ${i+1}</button>`;

  case 'tomorrow':
    return `<h2 class="step-title">Mål for i morgen</h2><p class="step-q">Skriv 1–3 mål. Neste kveld måler du deg mot dem.</p>

      <p class="hint">Gjør målene så konkrete at du kan krysse av for dem i morgen: «lese kap. 4 før kl. 20», ikke «lese mer».</p>`;
  case 'summary':{
    const c=cleanData(d);

    if(!c.tomorrow.length)h+=`<p class="warn-note">Du har ikke satt mål for i morgen. Uten mål har du ingenting å måle deg mot neste kveld.</p>`;
    if(missingScores)h+=`<p class="warn-note">Du har ikke gitt score på ${missingScores} ${missingScores===1?'tema':'temaer'}.</p>`;
    return h+`<div class="block">${summaryHTML(c)}</div>`;}
  }
  return '';
}

function flowAct(a,b){
  const d=flow.data;
  switch(a){
  case 'close':
    if(flow.editing){db.draft=null;save();closeFlow();}
    else{persist();closeFlow();toast('Utkastet er lagret');}
    break;
  case 'next': flow.step=Math.min(flow.step+1,steps().length-1); persist(); renderFlow(); break;
  case 'back': flow.step=Math.max(0,flow.step-1); persist(); renderFlow(); break;
  case 'timer': flow.timerStart=flow.timerStart?null:Date.now(); persist(); updateTimer(); break;
  case 'score': d.scores[b.dataset.k]=+b.dataset.v; $$('button',b.parentElement).forEach(x=>x.setAttribute('aria-pressed',String(x===b))); persistSoon(); break;
  case 'gstat':{const i=+b.dataset.i; d.goals[i].status=b.dataset.v; $$('button',b.parentElement).forEach(x=>x.setAttribute('aria-pressed',String(x===b))); const t=$('#tally'); if(t)t.textContent=tallyText(d.goals); persistSoon(); break;}
  case 'addGoal': d.goals.push({text:'',status:null,manual:true}); rerenderStep(); {const ins=$$('#flowInner .goal input');if(ins.length)ins[ins.length-1].focus();} persistSoon(); break;
  case 'etype': d.errType=b.dataset.v; $$('.type',b.parentElement).forEach(x=>x.setAttribute('aria-pressed',String(x===b))); persistSoon(); break;
  case 'addLesson': d.lessons.push({id:null,text:'',action:''}); rerenderStep(); persistSoon(); break;
  case 'rmLesson': d.lessons.splice(+b.dataset.i,1); rerenderStep(); persistSoon(); break;
  case 'reuse':{const i=+b.dataset.i, r=lessonRegistry(flow.date)[b.dataset.id]; if(r){d.lessons[i].id=r.id; d.lessons[i].text=r.text; d.lessons[i].action='';} rerenderStep(); persistSoon(); break;}
  case 'unlink': d.lessons[+b.dataset.i].id=null; rerenderStep(); persistSoon(); break;
  case 'saveEntry':{
    const c=cleanData(d); c.lessons.forEach(l=>{if(!l.id)l.id=uid('L');}); c.savedAt=new Date().toISOString();
    db.entries[flow.date]=c; const wasEdit=flow.editing; db.draft=null; save(); closeFlow(); window.scrollTo(0,0);
    toast(wasEdit?'Endringene er lagret':'Debriefen er lagret');
    break;}
  }
}

/* ---------- sheets, dialogs, toast ---------- */
function openSheet(html){$('#sheet-root').innerHTML=`<div class="backdrop" data-backdrop="sheet"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;document.body.classList.add('noscroll');}
function closeSheet(){if($('#sheet-root').innerHTML){$('#sheet-root').innerHTML='';if(!flow)document.body.classList.remove('noscroll');}}
function confirmDialog(text,okLabel,danger){
  return new Promise(res=>{
    const root=$('#dialog-root');
    root.innerHTML=`<div class="backdrop top"><div class="dialog" role="alertdialog" aria-modal="true"><p>${text}</p><div class="row"><button class="btn" data-dlg="no">Avbryt</button><button class="btn ${danger?'danger':'primary'}" data-dlg="yes">${okLabel}</button></div></div></div>`;
    root.onclick=e=>{const b=e.target.closest('[data-dlg]');if(!b)return;root.innerHTML='';root.onclick=null;res(b.dataset.dlg==='yes');};
    const y=root.querySelector('[data-dlg="yes"]'); if(y)y.focus();
  });
}
let toastT=null;
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2200);}

function openDetail(date){
  const e=db.entries[date]; if(!e)return;
  openSheet(`<div class="sheet-head"><h2 style="margin:0">${fmtLong(date)}</h2><button class="icon-btn" data-act="closeSheet" aria-label="Lukk">${ICON.x}</button></div>
    ${summaryHTML(e)}
    <div class="row" style="margin-top:20px"><button class="btn" data-act="edit" data-date="${date}">Endre</button><button class="btn ghost danger" data-act="delEntry" data-date="${date}">Slett kvelden</button></div>`);
}

function settingsHTML(){
  return `<div class="sheet-head"><h2 style="margin:0">Innstillinger</h2><button class="icon-btn" data-act="closeSheet" aria-label="Lukk">${ICON.x}</button></div>
  <section><h3 class="mini" style="margin-top:0">Temaer i hurtigscoren</h3><p class="sub" style="margin:0 0 4px">Endrer du navnet på et tema, beholdes historikken.</p>
    ${db.themes.map((t,i)=>`<div class="theme-row"><input data-theme="${esc(t.id)}" value="${esc(t.name)}" aria-label="Tema ${i+1}"><button class="btn small ghost" data-act="rmTheme" data-id="${esc(t.id)}" ${db.themes.length<2?'disabled':''}>Fjern</button></div>`).join('')}
    <div class="theme-row"><input id="newTheme" placeholder="Nytt tema, f.eks. Søvn" aria-label="Nytt tema"><button class="btn small" data-act="addTheme">Legg til</button></div></section>
  <section><h3 class="mini" style="margin-top:0">Lengde på timeren</h3>
    <div class="seg3">${[5,10,15].map(m=>`<button data-act="timerMin" data-v="${m}" aria-pressed="${db.settings.timerMin===m}">${m} min</button>`).join('')}</div></section>
  <section><label class="toggle"><input type="checkbox" id="showFacts" ${db.settings.showFacts?'checked':''}> Vis steget «Fakta fra dagen»</label></section>
  <section><h3 class="mini" style="margin-top:0">Sikkerhetskopi</h3>
    <p class="sub" style="margin:0 0 12px">Alt ligger bare på denne telefonen. ${db.lastBackup?`Siste kopi: ${fmtShort(iso(new Date(db.lastBackup))).toLowerCase()}.`:'Du har ikke tatt noen kopi ennå.'} Lagre kopien i Filer eller send den til deg selv.</p>
    <div class="row"><button class="btn" data-act="export">Lagre sikkerhetskopi</button><button class="btn" data-act="import">Hent fra kopi</button></div></section>
  <section><details><summary>Om metoden</summary>
    <p>Debriefen bygger på After Action Review, som den amerikanske hæren tok i bruk på 1970-tallet. Før det fikk soldatene feilene servert av en dommer. Med AAR finner de dem selv. Kampflygere gjør det samme etter hvert oppdrag, enten det gikk bra eller dårlig.</p>
    <p><b>Fire spørsmål.</b> Hva skulle skje? Hva skjedde faktisk? Hvorfor ble det en forskjell? Hva gjør jeg neste gang? Omtrent 25 % av tida går til de to første, 25 % til hvorfor og 50 % til neste gang. Når halve tida er satt av til neste gang, blir det lite rom for grubling.</p>
    <p><b>Mål å måle mot.</b> Hver gjennomgang starter med planen. Uten mål fra kvelden før blir gjennomføringen bare en følelse. Med mål blir den et tall.</p>
    <p><b>Tre typer feil.</b> Input-feil: du oppfattet situasjonen feil. Beslutningsfeil: du forsto situasjonen, men valgte feil. Utførelsesfeil: du valgte riktig, men gjennomføringen sviktet. Hver type har sitt eget tiltak, og det gjør «hvorfor» til en diagnose i stedet for selvpisking.</p>
    <p><b>Søndag.</b> Les gjennom ukas lærdommer. Dukker den samme opp igjen, virket ikke tiltaket. Da bytter du tiltak.</p>
    <p><b>Gjør den sterkere.</b> Forskningen tyder på at gjennomgangen virker best når den bygger på data i stedet for hukommelse, og når du innimellom går gjennom den med noen som kan faget, som en trener eller en lærer.</p>
  </details></section>
  <section><details><summary>Legg appen på Hjem-skjermen</summary><ol><li>Åpne siden i Safari.</li><li>Trykk på Del-knappen.</li><li>Velg «Legg til på Hjem-skjerm», la «Åpne som web-app» stå på, og trykk Legg til.</li></ol><p style="margin-top:8px">Dataene til web-appen ligger i appen på Hjem-skjermen, ikke i Safari. Bruk derfor appen fra Hjem-skjermen hele tida.</p></details></section>
  <section><button class="btn ghost danger" data-act="wipe" style="padding-left:0">Slett alle data</button></section>`;
}
function openSettings(){openSheet(settingsHTML());}
function refreshSettings(){const sh=$('#sheet-root .sheet');if(sh){const st=sh.scrollTop;sh.innerHTML=settingsHTML();sh.scrollTop=st;}}

/* ---------- backup ---------- */
function backupJSON(){return JSON.stringify(Object.assign({},db,{draft:null,app:'debrief',exportedAt:new Date().toISOString()}));}
async function exportBackup(){
  const json=backupJSON(), name=`debrief-kopi-${debriefDate()}.json`;
  try{
    const file=new File([json],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:'Debrief-sikkerhetskopi'});
      db.lastBackup=new Date().toISOString(); save(); refreshSettings(); render(); toast('Sikkerhetskopien er lagret'); return;
    }
  }catch(e){if(e&&e.name==='AbortError')return;}
  try{
    const url=URL.createObjectURL(new Blob([json],{type:'application/json'}));
    const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
    db.lastBackup=new Date().toISOString(); save(); refreshSettings(); render(); toast('Sikkerhetskopien er lastet ned');
  }catch(e){
    openSheet(`<div class="sheet-head"><h2 style="margin:0">Kopier sikkerhetskopien</h2><button class="icon-btn" data-act="closeSheet" aria-label="Lukk">${ICON.x}</button></div><p class="sub">Merk all teksten, kopier den og lim den inn i et notat.</p><textarea class="dump" readonly>${esc(json)}</textarea>`);
  }
}
async function importBackup(file){
  let o; try{o=JSON.parse(await file.text());}catch(e){toast('Filen kunne ikke leses');return;}
  if(!o||typeof o!=='object'||!o.entries||typeof o.entries!=='object'){toast('Filen er ikke en Debrief-kopi');return;}
  const n=Object.keys(o.entries).length;
  const ok=await confirmDialog(`Kopien har ${n} ${n===1?'kveld':'kvelder'}. Den erstatter alt som ligger i appen nå. Fortsette?`,'Erstatt med kopien',true);
  if(!ok)return;
  db=normalize(o); db.draft=null; save(); closeSheet(); render(); toast('Sikkerhetskopien er hentet');
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const bd=e.target.closest('[data-backdrop]'); if(bd&&e.target===bd){closeSheet();render();return;}
  const b=e.target.closest('[data-act],[data-tab]'); if(!b||b.disabled)return;
  if(b.dataset.tab){view=b.dataset.tab;if(view==='week')weekRef=null;render();window.scrollTo(0,0);return;}
  const a=b.dataset.act;
  if(flow&&b.closest('#flow'))return flowAct(a,b);
  switch(a){
  case 'start': openFlow(debriefDate()); break;
  case 'edit': openFlow(b.dataset.date); break;
  case 'detail': openDetail(b.dataset.date); break;
  case 'settings': openSettings(); break;
  case 'closeSheet': closeSheet(); render(); break;
  case 'goWeek': view='week'; weekRef=null; render(); window.scrollTo(0,0); break;
  case 'wprev': weekRef=addDays(curMonday(),-7); render(); break;
  case 'wnext': weekRef=addDays(curMonday(),7); render(); break;
  case 'saveWeek':{const w=db.weeks[curWeekKey]||(db.weeks[curWeekKey]={});$$('[data-wbind]').forEach(t=>w[t.dataset.wbind]=t.value);w.savedAt=new Date().toISOString();save();render();toast('Gjennomgangen er lagret');break;}
  case 'resumeOld': openFlow(db.draft.date); break;
  case 'discardOld': db.draft=null; save(); render(); break;
  case 'dismissInstall': db.settings.hideInstall=true; save(); render(); break;
  case 'export': exportBackup(); break;
  case 'import': $('#importFile').value=''; $('#importFile').click(); break;
  case 'addTheme':{const inp=$('#newTheme');const v=(inp.value||'').trim();if(!v){inp.focus();return;}db.themes.push({id:uid('t'),name:v});save();refreshSettings();break;}
  case 'rmTheme':{const t=db.themes.find(x=>x.id===b.dataset.id);if(!t)return;const ok=await confirmDialog(`Fjerne «${esc(t.name)}» fra hurtigscoren? Gamle tall blir liggende, men vises ikke lenger.`,'Fjern',true);if(!ok)return;db.themes=db.themes.filter(x=>x.id!==t.id);save();refreshSettings();break;}
  case 'timerMin': db.settings.timerMin=+b.dataset.v; save(); refreshSettings(); break;
  case 'delEntry':{const ok=await confirmDialog(`Slette debriefen for ${fmtShort(b.dataset.date).toLowerCase()}? Det kan ikke angres.`,'Slett',true);if(!ok)return;delete db.entries[b.dataset.date];save();closeSheet();render();toast('Kvelden er slettet');break;}
  case 'wipe':{const ok=await confirmDialog('Slette alle debriefer, ukesgjennomganger og innstillinger fra denne telefonen? Ta en sikkerhetskopi først hvis du vil beholde noe.','Slett alt',true);if(!ok)return;db=fresh();save();closeSheet();view='tonight';render();toast('Alle data er slettet');break;}
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(flow&&t.dataset.bind&&t.closest('#flow')){
    setPath(flow.data,t.dataset.bind,t.value);
    if(t.dataset.bind.indexOf('goals.')===0){const ty=$('#tally');if(ty)ty.textContent=tallyText(flow.data.goals);}
    persistSoon();return;
  }
  if(t.dataset.wbind&&curWeekKey){const w=db.weeks[curWeekKey]||(db.weeks[curWeekKey]={});w[t.dataset.wbind]=t.value;saveSoon();return;}
  if(t.dataset.theme){const th=db.themes.find(x=>x.id===t.dataset.theme);if(th){th.name=t.value.trim()||th.name;saveSoon();}}
});
document.addEventListener('change',e=>{
  if(e.target.id==='showFacts'){db.settings.showFacts=e.target.checked;save();}
  if(e.target.id==='importFile'&&e.target.files&&e.target.files[0])importBackup(e.target.files[0]);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='newTheme'){e.preventDefault();const b=$('[data-act="addTheme"]');if(b)b.click();}
  if(e.key==='Escape'){if($('#dialog-root').innerHTML)return;if($('#sheet-root').innerHTML){closeSheet();render();}}
});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){clearTimeout(saveTimer);save();}
  else if(!flow&&!$('#sheet-root').innerHTML)render();
});
window.addEventListener('resize',()=>{if(view==='log')drawSparks();});

render();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
})();
</script>
